services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: tpln
      POSTGRES_PASSWORD: tpln
      POSTGRES_DB: tpln
    ports:
      - "5433:5433"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tpln -d tpln"]
      interval: 5s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.6
    ports:
      - "7700:7700"
    environment:
      MEILI_MASTER_KEY: master_key_dev
      MEILI_ENV: development
    volumes:
      - meilisearch_data:/meili_data

  crawler:
    build:
      context: ./crawler
    volumes:
      - ./crawler/output:/crawler/output
    restart: unless-stopped
    environment:
      CRAWLER_INTERVAL: "3600"

volumes:
  postgres_data:
  meilisearch_data:
